name: CI/CD Pipeline

permissions:
  packages: write
  contents: read
# Trigger on push to main and pull requests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────
  # Job 1: Test the application
  # ──────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  # ──────────────────────────────────────
  # Job 2: Build & Push Docker Image
  # (only on push to main, not PRs)
  # ──────────────────────────────────────
  docker:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
           ghcr.io/parhampeyvasteh/devops-demo:latest
           ghcr.io/parhampeyvasteh/devops-demo:${{ github.sha }}